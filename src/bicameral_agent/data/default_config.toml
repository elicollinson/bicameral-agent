# Bicameral Agent — Default Hyperparameter Configuration
#
# All values here match the hardcoded defaults in the codebase.
# Override per-run via TOML file or BICAMERAL_ environment variables.

[model]
provider = "gemini"        # "gemini" or "ollama"
# name is unset (uses the provider's default model from the registry)
thinking_level = "medium"  # "minimal", "low", "medium", or "high"
# temperature is unset (uses model default)

# [measurement_model]
# Model held fixed for the measurement roles (LLM judge + simulated user) so
# cross-model answerer comparisons stay on one judging scale (issue #53).
# Unset = measurement roles use [model]. Only provider/name are consumed.
# provider = "gemini"
# name is unset (uses the provider's default model from the registry)

[queue]
count_threshold = 5        # interrupt if queue depth reaches this
priority_threshold = 3     # interrupt if any item >= CRITICAL (3)
token_threshold = 1000     # interrupt if total pending tokens reach this
# expiry_turns = 3         # expiry applied to every tool deposit (unset = per-tool defaults: refresher 3, others 10)
persistent_injection = true  # injected context enters history (false = transient one-generation whisper)

[tools]
# Default budget applied to all tools unless overridden below.
[tools.default_budget]
max_calls = 10
max_input_tokens = 50_000
max_output_tokens = 20_000

# Per-tool budget overrides (empty by default).
# Example:
# [tools.budgets.research_gap_scanner]
# max_calls = 5
# max_input_tokens = 25_000
# max_output_tokens = 10_000

[heuristic]
scanner_interval = 5            # invoke scanner every N turns
refresher_interval = 8          # invoke refresher every N turns
auditor_stop_threshold = 1      # stop_count >= this triggers auditor
auditor_high_stop_threshold = 2 # stop_count >= this triggers auditor (high priority)
queue_depth_guard = 3           # suppress tool invocation if queue depth >= this
stagger_tolerance_ms = 1000.0   # stagger guard window in milliseconds

[training]
learning_rate = 0.001
batch_size = 32
num_simulations = 100
gamma = 0.99

[training.reward_weights]
quality = 1.0
efficiency = 0.5
token_waste = -0.3

[mcts]
c_puct = 1.4
dirichlet_alpha = 0.3
num_simulations = 100
temperature = 1.0

[evaluation]
num_tasks = 10
random_seed = 42

[cost]
# session_budget = 1.00   # max dollars per session (unset = unlimited)
# episode_budget = 0.25   # max dollars per episode (unset = unlimited)

[run]
parallel_episodes = 1    # episodes run concurrently (1 = sequential); match the
                         # provider's concurrent-request allowance

